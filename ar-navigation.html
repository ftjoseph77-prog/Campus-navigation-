<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR Navigation · AJIET Campus Navigator</title>
<style>
:root{--navy:#12305a;--orange:#f08a1c}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}label{display:block;font-weight:600;font-size:14px}select{width:100%;font:inherit;padding:10px;border:1.5px solid #d9dfe9;border-radius:8px;background:#fff;color:#000}button,.btn{display:inline-block;font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 16px;background:var(--orange);color:#1b1000;cursor:pointer;text-decoration:none;margin:6px 4px 0}.btn.alt{background:var(--navy);color:#fff}
/* AR page */
body.ar{background:#000;color:#fff;overflow:hidden}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
#hud{position:fixed;left:0;right:0;top:0;padding:12px;background:linear-gradient(#000c,#0000);z-index:2}
#hud select{background:#fffe}
#arrowWrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;pointer-events:none}
#arrow{width:170px;height:170px;transition:transform .15s linear;filter:drop-shadow(0 4px 10px #000a)}
#info{margin-top:10px;text-align:center;text-shadow:0 2px 6px #000}
#info b{font-size:34px;display:block}
#bottom{position:fixed;left:0;right:0;bottom:0;padding:14px;text-align:center;z-index:2;background:linear-gradient(#0000,#000c)}
#status{font-size:14px;opacity:.9;margin:0 0 6px}
</style>
</head>
<body class="ar">
<video id="cam" playsinline muted autoplay></video>
<div id="hud">
  <label for="dest" style="margin:0 0 4px">Go to</label>
  <select id="dest"></select>
</div>
<div id="arrowWrap">
  <svg id="arrow" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M50 6 L88 86 L50 68 L12 86 Z" fill="#f08a1c" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
  </svg>
  <div id="info"><b id="dist">--</b><span id="next">Press Start</span></div>
</div>
<div id="bottom">
  <p id="status">Allow camera, location and motion access when asked.</p>
  <button id="start">Start AR</button>
  <a class="btn alt" href="index.html">Back to map</a>
</div>
<script src="campus-map.js"></script>
<script src="ar-navigation.js"></script>
</body>
</html>
